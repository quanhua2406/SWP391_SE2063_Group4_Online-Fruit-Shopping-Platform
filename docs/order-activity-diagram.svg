<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="980" viewBox="0 0 1960 980" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Swimlanes -->
  <rect x="0" y="0" width="1960" height="180" fill="#cdf4fb" stroke="#7fb8c4"/>
  <rect x="0" y="180" width="1960" height="180" fill="#fdfdc8" stroke="#c9c46a"/>
  <rect x="0" y="360" width="1960" height="180" fill="#fde3c4" stroke="#d9a06a"/>
  <rect x="0" y="540" width="1960" height="260" fill="#dff3dc" stroke="#8cc286"/>
  <rect x="0" y="800" width="1960" height="180" fill="#ece0f7" stroke="#a88bc9"/>

  <rect x="0" y="0" width="110" height="180" fill="#9fe0f1" stroke="#7fb8c4"/>
  <rect x="0" y="180" width="110" height="180" fill="#f2f098" stroke="#c9c46a"/>
  <rect x="0" y="360" width="110" height="180" fill="#f7c48c" stroke="#d9a06a"/>
  <rect x="0" y="540" width="110" height="260" fill="#bfe6b5" stroke="#8cc286"/>
  <rect x="0" y="800" width="110" height="180" fill="#d6bdeb" stroke="#a88bc9"/>
  <text x="55" y="90" font-size="15" font-weight="bold" text-anchor="middle" transform="rotate(-90 55 90)">Customer</text>
  <text x="55" y="270" font-size="15" font-weight="bold" text-anchor="middle" transform="rotate(-90 55 270)">System</text>
  <text x="55" y="450" font-size="15" font-weight="bold" text-anchor="middle" transform="rotate(-90 55 450)">Shop Owner</text>
  <text x="55" y="670" font-size="15" font-weight="bold" text-anchor="middle" transform="rotate(-90 55 670)">Shipper</text>
  <text x="55" y="890" font-size="15" font-weight="bold" text-anchor="middle" transform="rotate(-90 55 890)">Admin</text>

  <!-- Initial node -->
  <circle cx="60" cy="90" r="12" fill="#000"/>

  <!-- Customer lane -->
  <rect x="120" y="62" width="160" height="56" rx="8" fill="#fff" stroke="#333"/>
  <text x="200" y="85" font-size="13" text-anchor="middle">Browse products,</text>
  <text x="200" y="103" font-size="13" text-anchor="middle">add to cart</text>
  <line x1="72" y1="90" x2="120" y2="90" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="325" y="62" width="190" height="56" rx="8" fill="#fff" stroke="#333"/>
  <text x="420" y="85" font-size="13" text-anchor="middle">Checkout: address,</text>
  <text x="420" y="103" font-size="13" text-anchor="middle">payment, voucher</text>
  <line x1="280" y1="90" x2="325" y2="90" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="560" y="62" width="160" height="56" rx="8" fill="#fff" stroke="#333"/>
  <text x="640" y="85" font-size="13" text-anchor="middle">No order created</text>
  <text x="640" y="103" font-size="12" text-anchor="middle">(payment failed)</text>

  <!-- Final node -->
  <circle cx="1800" cy="90" r="14" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="1800" cy="90" r="9" fill="#000"/>
  <text x="1800" y="124" font-size="12" text-anchor="middle">End</text>

  <line x1="720" y1="90" x2="1786" y2="90" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- System lane: payment -->
  <line x1="420" y1="118" x2="420" y2="235" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <polygon points="420,235 490,270 420,305 350,270" fill="#fff" stroke="#333"/>
  <text x="420" y="266" font-size="12" text-anchor="middle">Payment</text>
  <text x="420" y="282" font-size="12" text-anchor="middle">online?</text>

  <line x1="350" y1="270" x2="310" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="330" y="262" font-size="11" text-anchor="middle">COD</text>
  <rect x="90" y="242" width="220" height="56" rx="8" fill="#fff" stroke="#333"/>
  <text x="200" y="264" font-size="13" text-anchor="middle">Create COD order</text>
  <text x="200" y="282" font-size="12" text-anchor="middle">pending_confirmation, Unpaid</text>

  <line x1="490" y1="270" x2="565" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="527" y="262" font-size="11" text-anchor="middle">Online</text>
  <polygon points="640,235 715,270 640,305 565,270" fill="#fff" stroke="#333"/>
  <text x="640" y="266" font-size="12" text-anchor="middle">Payment</text>
  <text x="640" y="282" font-size="12" text-anchor="middle">successful?</text>

  <line x1="640" y1="235" x2="640" y2="118" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="648" y="190" font-size="11">No</text>

  <line x1="715" y1="270" x2="790" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="752" y="262" font-size="11" text-anchor="middle">Yes</text>
  <rect x="790" y="242" width="220" height="56" rx="8" fill="#fff" stroke="#333"/>
  <text x="900" y="264" font-size="13" text-anchor="middle">Create online order</text>
  <text x="900" y="282" font-size="12" text-anchor="middle">pending_confirmation, Paid</text>

  <!-- Shop Owner lane -->
  <path d="M200,298 V450 H800" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="900" y1="298" x2="900" y2="422" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="800" y="422" width="200" height="56" rx="8" fill="#fff" stroke="#333"/>
  <text x="900" y="444" font-size="13" text-anchor="middle">Shop receives new order</text>
  <text x="900" y="462" font-size="12" text-anchor="middle">(pending_confirmation)</text>

  <line x1="1000" y1="450" x2="1035" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <polygon points="1100,415 1165,450 1100,485 1035,450" fill="#fff" stroke="#333"/>
  <text x="1100" y="446" font-size="12" text-anchor="middle">Shop</text>
  <text x="1100" y="462" font-size="12" text-anchor="middle">accepts?</text>

  <line x1="1100" y1="415" x2="1100" y2="298" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="1108" y="360" font-size="11">Reject</text>
  <rect x="990" y="242" width="220" height="56" rx="8" fill="#fff" stroke="#333"/>
  <text x="1100" y="264" font-size="13" text-anchor="middle">Order cancelled</text>
  <text x="1100" y="282" font-size="12" text-anchor="middle">Shop enters rejection reason</text>
  <path d="M1210,270 H1800 V104" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <line x1="1165" y1="450" x2="1220" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="1192" y="440" font-size="11" text-anchor="middle">Accept</text>
  <rect x="1220" y="422" width="200" height="56" rx="8" fill="#fff" stroke="#333"/>
  <text x="1320" y="444" font-size="13" text-anchor="middle">Pack order, assign shipper</text>
  <text x="1320" y="462" font-size="12" text-anchor="middle">status = shipping</text>

  <!-- Shipper lane -->
  <line x1="1320" y1="478" x2="1320" y2="605" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <polygon points="1320,605 1385,640 1320,675 1255,640" fill="#fff" stroke="#333"/>
  <text x="1320" y="636" font-size="12" text-anchor="middle">Shipper</text>
  <text x="1320" y="652" font-size="12" text-anchor="middle">accepts?</text>

  <line x1="1255" y1="640" x2="1180" y2="640" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="1218" y="632" font-size="11" text-anchor="middle">Reject</text>
  <rect x="980" y="612" width="200" height="56" rx="8" fill="#fff" stroke="#333"/>
  <text x="1080" y="634" font-size="13" text-anchor="middle">Shop assigns another shipper</text>
  <text x="1080" y="652" font-size="12" text-anchor="middle">(back to shipper selection)</text>
  <path d="M1080,612 V520 H1240 V478" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <line x1="1385" y1="640" x2="1460" y2="640" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="1420" y="632" font-size="11" text-anchor="middle">Accept</text>
  <rect x="1460" y="612" width="200" height="56" rx="8" fill="#fff" stroke="#333"/>
  <text x="1560" y="634" font-size="13" text-anchor="middle">Pick up (PickedUp)</text>
  <text x="1560" y="652" font-size="12" text-anchor="middle">→ Delivering</text>

  <line x1="1660" y1="640" x2="1735" y2="640" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <polygon points="1800,605 1865,640 1800,675 1735,640" fill="#fff" stroke="#333"/>
  <text x="1800" y="636" font-size="12" text-anchor="middle">Delivered</text>
  <text x="1800" y="652" font-size="12" text-anchor="middle">successfully?</text>

  <line x1="1800" y1="605" x2="1800" y2="104" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="1810" y="520" font-size="11">Yes</text>

  <line x1="1800" y1="675" x2="1800" y2="712" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="1810" y="697" font-size="11">No</text>
  <rect x="1690" y="712" width="220" height="56" rx="8" fill="#fff" stroke="#333"/>
  <text x="1800" y="734" font-size="13" text-anchor="middle">Delivery failed (Failed)</text>
  <text x="1800" y="752" font-size="12" text-anchor="middle">Shipper enters reason</text>

  <!-- Admin lane -->
  <line x1="1800" y1="768" x2="1800" y2="862" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="1690" y="862" width="220" height="56" rx="8" fill="#fff" stroke="#333"/>
  <text x="1800" y="884" font-size="13" text-anchor="middle">Admin handles issue</text>
  <text x="1800" y="902" font-size="12" text-anchor="middle">Reopen or cancel order</text>

  <path d="M1690,880 H1080 V668" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="1400" y="872" font-size="11" text-anchor="middle">Reopen (preparing)</text>

  <path d="M1690,905 H1200 V298" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="1400" y="922" font-size="11" text-anchor="middle">Cancel (cancelled)</text>
</svg>
